<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>YAPAIR Admin</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;margin:0;padding:20px}
  h1{color:#58a6ff;margin:0 0 4px}
  .sub{color:#8b949e;margin:0 0 20px;font-size:13px}
  h2{color:#58a6ff;font-size:16px;margin:24px 0 10px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px}
  .card h3{margin:0 0 6px;color:#8b949e;font-size:10px;text-transform:uppercase;letter-spacing:1px}
  .card .val{font-size:24px;font-weight:600}
  .ok{color:#3fb950}.err{color:#f85149}.warn{color:#d29922}.muted{color:#8b949e}
  button{background:#238636;color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
  button:hover{filter:brightness(1.15)}
  button:disabled{opacity:.4;cursor:not-allowed;filter:none}
  button.sec{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
  button.blue{background:#1f6feb}
  button.red{background:#da3633}
  button.amber{background:#9e6a03}
  button.small{padding:4px 10px;font-size:11px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .spacer{flex:1}
  table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #30363d;vertical-align:top}
  th{background:#161b22;color:#8b949e;font-weight:500;position:sticky;top:0}
  tr.selected{background:#14324b}
  tr:hover:not(.selected){background:#161b22}
  td.check{width:30px}
  .tablewrap{max-height:520px;overflow:auto;border:1px solid #30363d;border-radius:8px}
  code{background:#161b22;padding:1px 5px;border-radius:3px;font-family:ui-monospace,monospace;font-size:11px}
  .clip{max-width:280px;white-space:normal;word-break:break-word}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600}
  .badge.resolved{background:#0d2a14;color:#3fb950}
  .badge.not_resolved{background:#2a0d0d;color:#f85149}
  .badge.contradicted{background:#2a1f0d;color:#d29922}
  .badge.unknown{background:#21262d;color:#8b949e}
  .badge.archived{background:#2a1f0d;color:#d29922;margin-left:4px}
  .empty{color:#8b949e;font-style:italic;padding:24px;text-align:center}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:#161b22;border:1px solid #30363d;border-radius:10px;max-width:820px;width:92%;max-height:88vh;overflow:auto;padding:22px}
  .modal h2{margin:0 0 14px;color:#58a6ff}
  .modal dl{display:grid;grid-template-columns:160px 1fr;gap:8px 14px;margin:0}
  .modal dt{color:#8b949e;font-weight:600;font-size:12px}
  .modal dd{margin:0;font-size:13px;word-break:break-word}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .tabs{display:flex;gap:4px;margin-bottom:12px}
  .tab{padding:6px 14px;border-radius:6px;cursor:pointer;background:#21262d;color:#8b949e;font-size:12px;border:1px solid #30363d}
  .tab.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
</style>
</head>
<body>
<h1>YAPAIR Admin</h1>
<p class="sub">Vaka yönetimi · sadece bu makineden erişim</p>

<div class="cards" id="cards"><div class="card"><h3>Yükleniyor…</h3><div class="val">—</div></div></div>

<h2>Vakalar</h2>
<div class="tabs">
  <div class="tab active" data-arch="0" onclick="switchTab(this)">Aktif</div>
  <div class="tab" data-arch="1" onclick="switchTab(this)">Arşiv</div>
</div>

<div class="toolbar">
  <button class="sec small" onclick="selectAll(true)">Tümünü Seç</button>
  <button class="sec small" onclick="selectAll(false)">Temizle</button>
  <span id="selInfo" class="muted">0 seçili</span>
  <span class="spacer"></span>
  <button class="blue small" onclick="refresh()">🔄 Yenile</button>
  <button class="sec small" onclick="exportCsv()">📊 Excel/CSV</button>
  <button class="sec small" onclick="printReport()">🖨 PDF / Yazdır</button>
  <button class="amber small" onclick="bulkArchive()" id="archBtn">📦 Arşivle</button>
  <button class="sec small" onclick="bulkUnarchive()" id="unarchBtn" style="display:none">↩ Arşivden Çıkar</button>
  <button class="red small" onclick="bulkDelete()">🗑 Sil</button>
</div>

<div class="tablewrap"><table id="casesTable"><tbody><tr><td class="empty">Yükleniyor…</td></tr></tbody></table></div>

<h2>Son Batch'ler</h2>
<table id="batchesTable"></table>

<h2>Makineler</h2>
<table id="machinesTable"></table>

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modalTitle">Vaka Detayı</h2>
    <dl id="modalBody"></dl>
    <div class="modal-actions">
      <button class="sec" onclick="closeModal()">Kapat</button>
      <button class="sec" onclick="printSingle()">🖨 Yazdır/PDF</button>
    </div>
  </div>
</div>

<script>
const state = { archived: false, rows: [], selected: new Set(), detailId: null };

function switchTab(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  state.archived = el.dataset.arch === '1';
  state.selected.clear();
  document.getElementById('archBtn').style.display = state.archived ? 'none' : '';
  document.getElementById('unarchBtn').style.display = state.archived ? '' : 'none';
  refresh();
}

async function refresh(){
  try {
    const [health, stats] = await Promise.all([
      fetch('/health').then(r => r.json()),
      fetch('/admin/stats' + (state.archived ? '?archived=1' : '')).then(r => r.json())
    ]);
    renderHealth(health);
    renderStats(stats);
  } catch(e){
    document.getElementById('cards').innerHTML = `<div class="card"><h3>Hata</h3><div class="val err">${e.message}</div></div>`;
  }
}

function renderHealth(h){
  document.getElementById('cards').innerHTML =
    `<div class="card"><h3>API Durumu</h3><div class="val ok">${h.status}</div></div>` +
    `<div class="card"><h3>Servis</h3><div class="val" style="font-size:14px">${h.service}</div></div>` +
    `<div class="card"><h3>Sürüm</h3><div class="val" style="font-size:14px">${h.version}</div></div>`;
}

function renderStats(s){
  const c = document.getElementById('cards');
  c.innerHTML +=
    `<div class="card"><h3>Toplam Vaka</h3><div class="val">${s.cases.total}</div></div>` +
    `<div class="card"><h3>Toplam Batch</h3><div class="val">${s.batches.total}</div></div>` +
    `<div class="card"><h3>Toplam Makine</h3><div class="val">${s.machines.total}</div></div>`;

  state.rows = s.cases.recent || [];
  state.selected.clear();
  renderCases();
  renderBatches(s.batches.recent || []);
  renderMachines(s.machines.recent || []);
  updateSelInfo();
}

function renderCases(){
  const t = document.getElementById('casesTable');
  if (!state.rows.length){
    t.innerHTML = '<tbody><tr><td class="empty">Kayıt yok</td></tr></tbody>';
    return;
  }
  let html = '<thead><tr><th class="check"></th><th>Bilgisayar</th><th>Sorun</th><th>Semptom</th><th>Aile</th><th>Sonuç</th><th>Onay</th><th>Playbook</th><th>Tarih</th><th></th></tr></thead><tbody>';
  for (const r of state.rows){
    const id = r.case_id || '';
    const checked = state.selected.has(id) ? 'checked' : '';
    const rowCls = state.selected.has(id) ? 'selected' : '';
    const machine = (r.machines && r.machines.machine_label) || r.machine_key || '—';
    const symptom = (r.symptom_label && r.symptom_label !== r.symptom_code) ? r.symptom_label : (r.symptom_code || '—');
    const outcome = r.outcome || 'unknown';
    const arch = r.archived_at ? '<span class="badge archived">arşiv</span>' : '';
    html += `<tr class="${rowCls}">
      <td class="check"><input type="checkbox" ${checked} onchange="toggleRow('${esc(id)}', this.checked)"></td>
      <td><code>${esc(machine)}</code></td>
      <td class="clip">${esc(r.normalized_text || '—')}</td>
      <td>${esc(symptom)}</td>
      <td>${esc(r.issue_family || '—')}</td>
      <td><span class="badge ${outcome}">${esc(outcome)}</span></td>
      <td>${esc(r.user_confirmation || '—')}</td>
      <td><code>${esc(r.playbook_id || '—')}</code></td>
      <td>${esc(r.received_at || '')}</td>
      <td><button class="sec small" onclick="showDetail('${esc(id)}')">Detay</button> ${arch}</td>
    </tr>`;
  }
  html += '</tbody>';
  t.innerHTML = html;
}

function renderBatches(rows){
  const t = document.getElementById('batchesTable');
  if (!rows.length){ t.innerHTML = '<tr><td class="empty">Kayıt yok</td></tr>'; return; }
  t.innerHTML = '<thead><tr><th>Batch ID</th><th>Adet</th><th>API</th><th>Zaman</th></tr></thead><tbody>' +
    rows.map(r => `<tr><td><code>${esc(r.batch_id)}</code></td><td>${r.case_count}</td><td>${esc(r.api_version||'')}</td><td>${esc(r.received_at||'')}</td></tr>`).join('') +
    '</tbody>';
}

function renderMachines(rows){
  const t = document.getElementById('machinesTable');
  if (!rows.length){ t.innerHTML = '<tr><td class="empty">Kayıt yok</td></tr>'; return; }
  t.innerHTML = '<thead><tr><th>Makine</th><th>Etiket</th><th>lk</th><th>Son</th></tr></thead><tbody>' +
    rows.map(r => `<tr><td><code>${esc(r.machine_key)}</code></td><td>${esc(r.machine_label||'')}</td><td>${esc(r.first_seen||'')}</td><td>${esc(r.last_seen||'')}</td></tr>`).join('') +
    '</tbody>';
}

function toggleRow(id, on){
  if (on) state.selected.add(id); else state.selected.delete(id);
  updateSelInfo();
  renderCases();
}

function selectAll(on){
  state.selected.clear();
  if (on) state.rows.forEach(r => state.selected.add(r.case_id));
  renderCases();
  updateSelInfo();
}

function updateSelInfo(){
  document.getElementById('selInfo').textContent = state.selected.size + ' seçili';
}

async function showDetail(id){
  state.detailId = id;
  const bg = document.getElementById('modalBg');
  const body = document.getElementById('modalBody');
  body.innerHTML = '<dt>Yükleniyor…</dt><dd></dd>';
  bg.classList.add('show');
  try {
    const r = await fetch('/admin/case/' + encodeURIComponent(id)).then(x => x.json());
    if (r.error){ body.innerHTML = `<dt>Hata</dt><dd class="err">${esc(r.detail || r.error)}</dd>`; return; }
    body.innerHTML = detailHtml(r);
  } catch(e){
    body.innerHTML = `<dt>Hata</dt><dd class="err">${esc(e.message)}</dd>`;
  }
}

function detailHtml(r){
  const machine = (r.machines && r.machines.machine_label) || r.machine_key || '—';
  const fields = [
    ['Vaka ID', r.case_id],
    ['Bilgisayar', machine],
    ['Makine Anahtarı', r.machine_key],
    ['Sorun (ham)', r.normalized_text],
    ['Semptom', r.symptom_label || r.symptom_code],
    ['Semptom Kodu', r.symptom_code],
    ['Aile', r.issue_family],
    ['Domain', r.domain],
    ['Uygulanan Playbook', r.playbook_id],
    ['Sonuç', r.outcome],
    ['Kullanıcı Onayı', r.user_confirmation],
    ['Alındı', r.received_at],
    ['Arşiv', r.archived_at || '—'],
    ['Ham Metin', r.raw_text || '—']
  ];
  return fields.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v == null ? '—' : esc(String(v))}</dd>`).join('');
}

function closeModal(ev){
  if (ev && ev.target !== document.getElementById('modalBg')) return;
  document.getElementById('modalBg').classList.remove('show');
}

function printSingle(){
  if (!state.detailId) return;
  window.open('/admin/print?id=' + encodeURIComponent(state.detailId) + '&auto=1', '_blank');
}

function exportCsv(){
  window.location = '/admin/export.csv' + (state.archived ? '?archived=1' : '');
}

function printReport(){
  window.open('/admin/print' + (state.archived ? '?archived=1&auto=1' : '?auto=1'), '_blank');
}

async function bulkArchive(){
  if (!state.selected.size) return alert('Önce satır seçin.');
  if (!confirm(state.selected.size + ' vakayı arşivlemek istiyor musunuz?')) return;
  await doBulk('/admin/cases/archive');
}

async function bulkUnarchive(){
  if (!state.selected.size) return alert('Önce satır seçin.');
  if (!confirm(state.selected.size + ' vakayı arşivden çıkarmak istiyor musunuz?')) return;
  await doBulk('/admin/cases/unarchive');
}

async function bulkDelete(){
  if (!state.selected.size) return alert('Önce satır seçin.');
  if (!confirm(state.selected.size + ' vakayı KALICI olarak silmek istediğinize emin misiniz?\n\nBu işlem geri alınamaz. Arşivlemek istiyorsanız "Arşivle" kullanın.')) return;
  await doBulk('/admin/cases/delete');
}

async function doBulk(url){
  const ids = Array.from(state.selected);
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids })
    });
    const j = await r.json();
    if (!r.ok){ alert('Hata: ' + JSON.stringify(j)); return; }
    state.selected.clear();
    await refresh();
  } catch(e){ alert('Hata: ' + e.message); }
}

function esc(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
